<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIVRODEFACE</title><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:12px}.grid{display:grid;gap:12px;grid-template-columns:1fr}.card{background:#1e1e1e;border-radius:12px;overflow:hidden}iframe{width:100%;height:220px;border:0}</style></head><body><h1>LIVRODEFACE</h1><div id="app">Carregando...</div><script>async function carregar(){const r=await fetch('catalog.json?t='+Date.now());const dados=await r.json();const app=document.getElementById('app');app.innerHTML='<div class="grid"></div>';const grid=app.querySelector('.grid');dados.forEach(v=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(v.url)}&show_text=false" allowfullscreen></iframe><p style="padding:8px">${v.titulo}</p>`;grid.appendChild(d);});}carregar();</script></body></html>
