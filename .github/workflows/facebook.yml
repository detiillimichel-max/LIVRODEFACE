name: Facebook - Importa, Organiza e Publica

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: livrodeface-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Importar salvos.json para candidatos
        id: importar
        run: node roteiros/importar-salvos.js

      - name: Validar links de incorporação quando possível
        id: buscar
        continue-on-error: true
        run: node roteiros/buscar.js
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}

      - name: Salvar candidatos e catálogo
        if: always() && steps.importar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/candidatos.json catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Importa links salvos e atualiza catálogo"
            git push
          else
            echo "Sem mudanças nos catálogos."
          fi

      - name: Configurar GitHub Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Preparar site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar site
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Avisar se a validação falhou
        if: steps.buscar.outcome == 'failure'
        run: echo "::warning::Os links salvos foram importados, mas a validação Meta falhou. O app continua mostrando os candidatos e oferece abrir no Facebook."
